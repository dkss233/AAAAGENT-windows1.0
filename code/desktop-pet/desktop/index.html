<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' pet:; script-src 'self' pet: 'wasm-unsafe-eval'; style-src 'self' pet:; img-src 'self' pet: blob:; connect-src 'self' pet: blob:; media-src 'self' pet: blob:; worker-src blob:"><title>AAAAGENT</title><link rel="stylesheet" href="style.css"></head><body>
<button id="pet-ball" type="button" aria-label="展开桌宠；拖动可移动" title="展开桌宠" hidden><span aria-hidden="true">✦</span></button><main id="pet"><button id="pet-collapse" type="button" aria-label="收为小球" title="收为小球">−</button><div id="character"><canvas id="model" aria-label="AAAAGENT桌宠，点击聊天，拖动移动"></canvas><span id="thinking-indicator" role="status" aria-live="polite" hidden><span class="thinking-orbit" aria-hidden="true"><span>✦</span></span><span>想一想…</span></span><span id="loading">AAAAGENT正在过来…</span></div><button id="work-badge" type="button" aria-live="polite" aria-controls="work-card" aria-expanded="false" hidden></button><button id="invitation" hidden></button><button id="model-resize" type="button" aria-label="拖动调整模型大小；方向键也可调整" data-resizing="false"></button><button id="pointer-lock" type="button" aria-pressed="false" title="锁定鼠标穿透（锁定后把鼠标移到这个按钮上即可解锁）" aria-label="锁定鼠标穿透，锁定后点击会落到下方窗口">🔒</button><button id="model-move" type="button" aria-pressed="false" title="点击开启调整模型（滚轮缩放、拖动平移）；长按重置窗口大小" aria-label="调整模式，开启后可用滚轮缩放、拖动角色平移">✥</button><button id="model-look" type="button" aria-pressed="false" title="点击让模型注视鼠标（眼睛、头部和身体一起跟随；再点关闭）" aria-label="注视鼠标，开启后模型的眼睛、头部和身体会跟随鼠标移动">👁</button><div id="capture-feedback" hidden aria-label="语音输入状态"><span id="capture-connecting" role="status">正在连接语音</span><span id="capture-wave" hidden><svg viewBox="0 0 160 24" role="img" aria-label="实时输入音量"><path id="capture-wave-path" d=""></path></svg></span></div><button id="open" aria-label="打开对话" aria-controls="drawer" aria-expanded="false">聊一会儿</button></main>
<section id="drawer" hidden aria-label="对话面板">
 <header><div class="panel-title"><span class="presence-dot" aria-hidden="true"></span><strong id="character-name">德克萨斯</strong></div><button id="management" type="button" title="打开网页控制台" aria-label="打开网页控制台">控制台</button><div id="display-controls" role="group" aria-label="展示模式"><button id="view-full" type="button" aria-pressed="true">全身</button><button id="view-half" type="button" aria-pressed="false">半身</button></div><button id="close" aria-label="收起对话">×</button></header>
 <div id="model-settings"><label for="model-kind">角色</label><select id="model-kind"><option value="video">视频鲸鱼</option><option value="live2d">Live2D</option></select><input id="character-name-input" type="text" maxlength="24" aria-label="角色名字" placeholder="角色名字" title="角色名字，回车或失焦后生效"><span id="video-controls"><select id="video-action" aria-label="视频动作"></select><button id="video-play" type="button">播放</button><button id="video-reassure" type="button">安抚</button></span></div>
 <p id="management-notice" role="status" hidden></p>
 <p id="status" role="status">正在连接…</p>
 <div id="workbench-launch"><button id="workbench-open" type="button" aria-haspopup="dialog" aria-controls="workbench-dialog">工程速览</button><span id="workbench-summary" role="status">连接后读取项目与任务</span></div>
 <section id="conversation" aria-label="对话与任务内容" tabindex="0">
 <div id="reply" role="log" aria-live="polite" aria-label="聊天记录与开场"></div>
 <section id="workbench-source" aria-label="当前工程原话" hidden></section>
 <section id="work-card" aria-label="工程转交与回执" hidden></section>
 </section>
 <section id="work-actions" aria-label="任务操作" hidden></section>
 <form id="form"><label class="sr-only" for="text">想说的话</label><textarea id="text" rows="1" autocomplete="off" placeholder="想说些什么…"></textarea><button type="submit" id="send" aria-label="发送">↑</button></form>
 <footer><button id="voice">开始语音</button><button id="stop" hidden>停止</button><span id="hint">语音使用麦克风与摄像头</span><button id="quit" aria-label="退出桌宠">退出</button></footer>
 <div id="hotkey-settings"><span>输入框外按住发言 · <b id="hotkey-value">未绑定</b></span><button id="hotkey-bind" type="button">设置按键</button><button id="hotkey-clear" type="button">清除</button><span class="input-tip">Enter 发送 · Shift + Enter 换行</span></div>
</section>
<dialog id="work-records-dialog" aria-labelledby="work-records-title"><header><h2 id="work-records-title">工程记录</h2><div class="pet-window-actions"><button id="work-records-collapse" type="button" aria-label="收为小球" title="收为小球">−</button><button id="work-records-close" type="button" aria-label="关闭工程记录">×</button></div></header><div id="work-records-content" tabindex="0" aria-label="任务问答与执行详情"></div></dialog>
<dialog id="workbench-dialog" aria-labelledby="workbench-title"><header><h2 id="workbench-title">工程速览</h2><div class="pet-window-actions"><button id="workbench-collapse" type="button" aria-label="收为小球" title="收为小球">−</button><button id="workbench-close" type="button" aria-label="关闭工程速览">×</button></div></header><div id="workbench-content" tabindex="0" aria-label="项目摘要、原生入口和简短回应"></div><div id="workbench-footer" aria-label="速览操作"></div></dialog>
<script src="vendor/cubism/Core/live2dcubismcore.min.js"></script><script type="module" src="build/renderer.js"></script></body></html>
