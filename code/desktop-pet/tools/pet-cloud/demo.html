<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>桌宠 · 本地与云端</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#27352f;background:#f6f6f0}*{box-sizing:border-box}body{max-width:1180px;margin:44px auto;padding:0 24px}header{margin-bottom:32px}.eyebrow{color:#537463;font-size:13px;letter-spacing:.1em}h1{font-size:32px;margin:10px 0}p{line-height:1.7;color:#5c6861}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}section{background:white;padding:24px;border:1px solid #dfe5da;border-radius:18px;min-width:0}h2{font-size:19px;margin:0 0 12px}textarea{width:100%;min-height:114px;resize:vertical;border:1px solid #d3ddd3;border-radius:10px;padding:12px;font:inherit;line-height:1.5;background:#fafbf8}button{border:0;border-radius:9px;background:#356a51;color:white;padding:11px 15px;font:inherit;cursor:pointer;margin-top:12px}button:disabled{opacity:.5;cursor:wait}.quiet{background:#eef3ed;color:#365441}label{display:block;margin:15px 0;font-size:14px}.record{border-top:1px solid #edf0e9;padding:13px 0;line-height:1.65;overflow-wrap:anywhere;font-size:14px}.meta{font-size:12px;color:#728078}.tag{display:inline-block;padding:5px 10px;border-radius:20px;background:#e5efe4;font-size:12px;color:#3d634a}#notice{min-height:30px;margin:20px 0;color:#37694e}#reply{white-space:pre-wrap;line-height:1.7;margin-top:18px;font-size:14px}.footer{font-size:13px;margin-top:26px}@media(max-width:900px){.grid{grid-template-columns:1fr}body{margin-top:24px}}
</style>
<header><span class="eyebrow">LOCAL COMPANION / SOCIAL CLOUD</span><h1>同一个角色，两种生活场景</h1><p>左边保存你与桌宠的私人记录，右边展示它参与社交后带回的经历。</p><span class="tag">合成联调 · 不调用模型 · 不发送真实群消息</span></header>
<div class="grid">
<section><h2>本地 · 与你相处</h2><p>这里的测试记录只留在本机演示私库。</p><textarea id="privateText" aria-label="本地私人记录" placeholder="例如：这是只想告诉桌宠的事情。"></textarea><button id="savePrivate">保存本地记录</button><div id="privateNotes"></div></section>
<section><h2>云端 · 它的社交</h2><p>模拟群友“小李”发来一条消息。角色回复确认后，才形成社交经历。</p><textarea id="groupText" aria-label="模拟群消息" placeholder="例如：我最近开始学 Blender 了。"></textarea><button id="sendGroup">发送模拟群消息</button><div id="reply" aria-live="polite"></div><label><input type="checkbox" id="share"> 允许桌宠带回这个群的经历</label><button class="quiet" id="connection">暂停本地同步</button></section>
<section><h2>桌宠带回的经历</h2><p id="connectionState">正在读取连接状态…</p><div id="experiences"></div></section>
</div><div id="notice" role="status"></div><p class="footer">本页使用独立的演示数据。可测试离线补齐、群共享和经历撤回。断开超过五分钟后，过期社交资料停止用于回答，重新同步后恢复。</p>
<script>
let state;
const el=id=>document.getElementById(id);
function block(text,cls='record'){const div=document.createElement('div');div.className=cls;div.textContent=text;return div;}
async function refresh(){const r=await fetch('/state');if(!r.ok)throw Error();state=await r.json();el('share').checked=state.share;el('connection').textContent=state.disconnected?'恢复本地同步':'暂停本地同步';el('connectionState').textContent=state.disconnected?'本地同步已暂停。云端继续记录社交经历。':'连接正常。仅显示获准带回的经历。';el('privateNotes').replaceChildren(...state.privateNotes.map(n=>block(n.text)));const records=state.experiences.map(e=>{const div=block(e.summary);div.append(block('来源：模拟群 · 参与者：'+e.participants.map(p=>p.name).join('、'),'meta'));const b=document.createElement('button');b.className='quiet';b.textContent='遗忘这段经历';b.onclick=()=>act('/forget',{id:e.id});div.append(b);return div;});el('experiences').replaceChildren(...(records.length?records:[block('还没有可带回的经历。') ]));}
async function act(path,body){document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await r.json();if(!r.ok)throw Error(data.error);if(data.reply)el('reply').textContent=data.reply;el('notice').textContent=data.message??'角色已在模拟群回复，经历已按当前共享设置处理。';await refresh();}catch(e){el('notice').textContent=e.message||'连接暂时不可用，请刷新重试。';}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
el('savePrivate').onclick=()=>act('/private',{text:el('privateText').value});el('sendGroup').onclick=()=>act('/group',{text:el('groupText').value});el('share').onchange=()=>act('/share',{enabled:el('share').checked});el('connection').onclick=()=>act('/connection',{disconnected:!state.disconnected});refresh().catch(()=>el('notice').textContent='服务连接失败，请重新打开演示首页。');
</script></html>
